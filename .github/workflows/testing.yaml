name: Testing

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, dev ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: "--timeout=30m"
  test:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - parallel:
        - name: "Unit & module tests (mattn/go-sqlite3 driver)"
          run: |
            go test ./...
        - name: "Unit & module tests (modernc.org/sqlite driver)"
          run: |
            go test -tags modernc ./...
  imaptest:
    name: "Run imaptest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: "Install imaptest"
        run: |
          wget -O /usr/local/bin/imaptest 'https://github.com/dovecot/imaptest/releases/download/latest/imaptest-x86_64-ubuntu-24.04'
          chmod +x /usr/local/bin/imaptest
      - parallel:
          - name: "imaptest (mattn/go-sqlite3 driver)"
            run: |
              go test -tags imaptest ./tests/imap2 \
                -run '^TestImaptest.*$' \
                -test.imaptest /usr/local/bin/imaptest \
                -test.imaptest-rawlog \
                -test.imaptest-dir \
                $PWD/tests/imap2/imaptest/tests
          - name: "imaptest (modernc.org/sqlite driver)"
            run: |
              go test -tags 'imaptest modernc' ./tests/imap2 \
                -run '^TestImaptest.*$' \
                -test.imaptest /usr/local/bin/imaptest \
                -test.imaptest-rawlog \
                -test.imaptest-dir \
                $PWD/tests/imap2/imaptest/tests
